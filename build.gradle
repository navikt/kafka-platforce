plugins {
    id 'application'

    id 'org.jetbrains.kotlin.jvm' version '2.4.21'
    id 'org.jmailen.kotlinter' version '5.2.0'
    id 'com.gradleup.shadow' version '8.3.11'
}

group 'no.nav.sf.pdl.kafka'
version '0.1'

jar {
    manifest {
        attributes 'Main-Class': 'no.nav.sf.pdl.kafka.BootstrapKt'
    }
}

shadowJar {
    archiveBaseName = 'app'
    archiveClassifier = ''
}

application {
    mainClassName = 'no.nav.sf.pdl.kafka.BootstrapKt'
}

repositories {
    mavenCentral()
    maven {
        url "https://packages.confluent.io/maven"
    }
}

configurations {
    all*.exclude group: 'org.slf4j', module: 'slf4j-log4j12'
}

dependencies {

    implementation 'com.google.code.gson:gson:2.15.0'

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"

    implementation "org.http4k:http4k-core:6.61.0.0"
    implementation "org.http4k:http4k-server-netty:6.61.0.0"
    implementation "org.http4k:http4k-client-okhttp:6.61.0.0"

    implementation "org.apache.kafka:kafka-clients:4.4.0"



    implementation "org.xerial.snappy:snappy-java:1.1.10.11" // Transitive dependency for org.apache.kafka:kafka-clients:4.4.0
    implementation "at.yawk.lz4:lz4-java:1.12.1" // Transitive dependency for org.apache.kafka:kafka-clients:4.3.0
    implementation "io.github.microutils:kotlin-logging:3.0.5"
    implementation "ch.qos.logback:logback-classic:1.6.6"
    implementation "net.logstash.logback:logstash-logback-encoder:9.0"
    implementation "tools.jackson.core:jackson-databind:3.2.4" // Transitive dependency on logback-encoder 9.0

    implementation "io.prometheus:simpleclient_common:0.9.0"
    implementation "io.prometheus:simpleclient_hotspot:0.9.0"

    implementation("org.postgresql:postgresql:42.7.14")

    implementation 'org.jetbrains.exposed:exposed-core:0.61.0'
    implementation 'org.jetbrains.exposed:exposed-dao:0.61.0'
    implementation 'org.jetbrains.exposed:exposed-jdbc:0.61.0'
    implementation 'org.jetbrains.exposed:exposed-java-time:0.61.0'
    
    implementation "com.zaxxer:HikariCP:5.1.0"

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.11.4'
    testImplementation 'io.mockk:mockk:1.14.11'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.11.4'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

sourceSets {
    main.kotlin.srcDirs += 'src/main/kotlin'
    test.kotlin.srcDirs += 'src/test/kotlin'
}

apply from: 'gradle/mergeYamlTask.gradle'
apply from: 'gradle/updateDispatchWorkflow.gradle'

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile) {
    dependsOn("mergeYamlTask")
    dependsOn("updateDispatchWorkflow")
}

kotlin {
    jvmToolchain(21)
}
