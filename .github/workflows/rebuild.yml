name: Rebuild and deploy selected applications

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Comma-separated app:cluster pairs"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Validate deployment targets
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Parse and validate targets
        id: targets
        env:
          TARGETS: ${{ inputs.targets }}
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          targets = []
          for value in os.environ["TARGETS"].split(","):
              value = value.strip()
              if not re.fullmatch(r"[a-z0-9][a-z0-9-]*:(dev-gcp|prod-gcp)", value):
                  raise SystemExit(f"Invalid target: {value!r}")

              app, cluster = value.split(":")
              if not Path(f".nais/{app}/{cluster}.yaml").is_file():
                  raise SystemExit(f"No deployment manifest for {value}")

              target = {"app": app, "cluster": cluster}
              if target not in targets:
                  targets.append(target)

          if len(targets) > 50:
              raise SystemExit("At most 50 deployment targets are allowed")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"targets={json.dumps(targets)}\n")
          PY

  rebuild:
    name: Rebuild ${{ matrix.target.app }} in ${{ matrix.target.cluster }}
    needs: prepare
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}
    uses: ./.github/workflows/workflow.yml
    secrets: inherit
    with:
      DEPLOY_APP: ${{ matrix.target.app }}
      DEPLOY_CLUSTER: ${{ matrix.target.cluster }}
      FLAG_SEEK: false
      SEEK_OFFSET: '0'
      NUMBER_OF_SAMPLES: '3'
      FLAG_NO_POST: false
      FLAG_ALT_ID: false